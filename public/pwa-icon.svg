<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#glow)" stroke-width="4" />

  <!-- Compass Star Emblem -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Compass Ring -->
    <circle r="150" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-dasharray="8 12" opacity="0.6" />
    <circle r="120" fill="#064e3b" opacity="0.4" />

    <!-- 4 Cardinal Star Points -->
    <!-- North Point (Gold) -->
    <polygon points="0,-150 24,-28 0,0" fill="url(#gold)" />
    <polygon points="0,-150 -24,-28 0,0" fill="#f59e0b" />

    <!-- South Point -->
    <polygon points="0,150 24,28 0,0" fill="#ffffff" />
    <polygon points="0,150 -24,28 0,0" fill="#d1fae5" />

    <!-- East Point -->
    <polygon points="150,0 28,24 0,0" fill="#ffffff" />
    <polygon points="150,0 28,-24 0,0" fill="#d1fae5" />

    <!-- West Point -->
    <polygon points="-150,0 -28,24 0,0" fill="#ffffff" />
    <polygon points="-150,0 -28,-24 0,0" fill="#d1fae5" />

    <!-- Center Ring & Sparkle -->
    <circle r="26" fill="#047857" stroke="#fef08a" stroke-width="6" />
    <circle r="10" fill="#ffffff" />
  </g>
</svg>
